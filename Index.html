<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#061008"
    >

    <title>CODE : 죽림고수</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <div id="game-wrapper">

        <!-- 게임 Canvas -->
        <canvas id="gameCanvas"></canvas>


        <!-- =========================
             HUD
        ========================== -->

        <div id="hud">

            <div class="hud-box">

                <span class="hud-label">
                    LIFE
                </span>

                <span id="life">
                    ♥
                </span>

            </div>


            <div class="hud-box hud-center">

                <span class="hud-label">
                    SURVIVAL
                </span>

                <span id="time">
                    00.00
                </span>

            </div>


            <div class="hud-box">

                <span class="hud-label">
                    BEST
                </span>

                <span id="best">
                    00.00
                </span>

            </div>

        </div>


        <!-- =========================
             시작 화면
        ========================== -->

        <section
            id="startScreen"
            class="screen"
        >

            <div class="title-area">

                <div class="subtitle">
                    SURVIVAL ARCHERY
                </div>

                <h1>
                    CODE
                </h1>

                <h2>
                    죽림고수
                </h2>

                <p>
                    쏟아지는 화살을 피해<br>
                    단 하나의 목숨으로 살아남아라.
                </p>

            </div>


            <div class="control-area">

                <div class="arrow-keys">

                    <div class="key-row">
                        <span>↑</span>
                    </div>

                    <div class="key-row">

                        <span>←</span>
                        <span>↓</span>
                        <span>→</span>

                    </div>

                </div>

                <span>
                    방향키로 이동
                </span>

            </div>


            <button
                id="startButton"
                class="game-button"
            >
                게임 시작
            </button>

        </section>


        <!-- =========================
             게임 오버
        ========================== -->

        <section
            id="gameOverScreen"
            class="screen hidden"
        >

            <div class="game-over-card">

                <div class="subtitle">
                    SURVIVAL ENDED
                </div>

                <h2>
                    GAME OVER
                </h2>


                <div class="result-box">

                    <div>

                        <span>
                            SURVIVAL
                        </span>

                        <strong id="finalTime">
                            00.00
                        </strong>

                    </div>


                    <div>

                        <span>
                            BEST
                        </span>

                        <strong id="finalBest">
                            00.00
                        </strong>

                    </div>

                </div>


                <button
                    id="restartButton"
                    class="game-button"
                >
                    다시 시작
                </button>


                <p class="restart-guide">
                    R 키로도 다시 시작할 수 있습니다.
                </p>

            </div>

        </section>


    </div>


    <!-- 게임 시작점 -->
    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
